<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camillie Bite - Link in Bio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cardBg: '#1c1c1e',
                        btnBg: '#2c2c2e',
                        btnHover: '#3a3a3c',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #000;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 relative">

    <!-- Background Image with Blur -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <div class="absolute inset-[-10%] bg-[url('1.jpg')] bg-cover bg-center filter blur-2xl opacity-70"></div>
        <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <!-- Main Card Container -->
    <div class="relative z-10 w-full max-w-[360px] bg-cardBg rounded-[32px] overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/5 flex flex-col">
        
        <!-- Header Image Section -->
        <div class="relative h-[300px] w-full">
            <img src="1.jpg" alt="Camillie Header" class="w-full h-full object-cover object-top">
            <!-- Gradient Overlay to blend image into the dark card body -->
            <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-b from-transparent to-cardBg"></div>
            
            <!-- Profile Info (Positioned over the bottom of the header image) -->
            <div class="absolute bottom-0 left-0 right-0 text-center pb-2">
                <h1 class="text-white text-2xl font-bold flex items-center justify-center gap-1.5">
                    Camillie Bite
                    <i class="fa-solid fa-circle-check text-[#1d9bf0] text-lg"></i>
                </h1>
                <div class="text-gray-300 text-sm mt-1 flex items-center justify-center gap-1.5 font-medium">
                    @camillie.bite
                    <span class="text-gray-500 mx-0.5">|</span>
                    <span class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
                        Online
                    </span>
                </div>
            </div>
        </div>

        <!-- Social Icons Row -->
        <div class="flex justify-center gap-4 mt-5 mb-2">
            <a href="https://www.instagram.com/camile.bite" target="_blank" class="w-10 h-10 rounded-full bg-btnBg hover:bg-btnHover transition-colors flex items-center justify-center text-white text-lg">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>

        <!-- Media Card (More of me) -->
        <a href="https://onlyfans.com/camille.bite/c57" target="_blank" class="mx-4 mt-4 relative block rounded-2xl overflow-hidden group border border-white/5 shadow-lg">
            <div class="h-[200px] w-full">
                <img src="2.jpg" alt="More of me" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
            </div>
            <!-- Bottom Text Overlay -->
            <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex justify-center items-end h-24">
                <span class="text-white font-semibold text-sm tracking-wide">More of me</span>
            </div>
        </a>

        <!-- TikTok Button -->
        <a href="https://www.tiktok.com/@camillie.bite" target="_blank" class="mx-4 mt-4 mb-6 bg-btnBg hover:bg-btnHover transition-colors rounded-xl p-3.5 flex items-center justify-center gap-3 relative shadow-md">
            <div class="absolute left-4 flex items-center">
                <i class="fa-brands fa-tiktok text-white text-xl"></i>
            </div>
            <span class="text-white font-semibold text-sm">TikTok</span>
        </a>

    </div>

</body>
</html>
